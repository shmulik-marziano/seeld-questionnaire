[package]
name = "shmuel-desktop"
version = "0.1.0"
description = "Shmuel desktop wrapper"
authors = ["Shmuel"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "shmuel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
